{% extends "account/base.html" %}

{% block head_title %}{% trans %}Set Password{% endtrans %}{% endblock %}
{% block page_title %}{% trans %}Set Password{% endtrans %}{% endblock %}

{% block card %}
<form method="POST" action="{{ url_for('accounts.set_password') }}" class="password_set">
    {{ csrf_token_input() }}
    {{ form|a17t }}
    <button type="submit" name="action" class="button ~urge !high">{% trans %}Set Password{% endtrans %}</button>
</form>
{% endblock %}
