{% if non_field_errors(form) %}
<aside class="aside ~critical content mb-4">
    {% for non_field_error in non_field_errors(form) %}
    <p>{{ non_field_error }}</p>
    {% endfor %}
</aside>
{% endif %}

{% for field in hidden_fields(form) %}
  {{ field() }}
{% endfor %}

{% for field in visible_fields(form) %}
  {% include 'a17t/includes/field.html' %}
{% endfor %}
